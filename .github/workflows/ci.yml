name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Pages
        run: npm run build

      - name: Verify Cloudflare Pages asset paths
        run: npm run verify:build-paths -- cloudflare

      - name: Build for GitHub Pages
        run: VITE_DEPLOY_TARGET=github-pages npm run build

      - name: Verify GitHub Pages asset paths
        run: npm run verify:build-paths -- github-pages
